# pnpm v11 configuration for the root app.
#
# In pnpm 11, settings are NO LONGER read from the `pnpm` field in package.json,
# and only auth/registry settings are read from .npmrc. Everything else lives here.
# A setting left in package.json is ignored SILENTLY, with no warning — see
# https://github.com/pnpm/pnpm/issues/11536
#
# `packages:` is deliberately omitted. With no `packages` field only the root
# package is in the workspace, which keeps `studio/` an independent install with
# its own lockfile — matching how this repo has always been structured.

# Was `overrides` in package.json under npm. pnpm 11 does not read that field.
# Required so @svgr/rollup's @babel/preset-env and @vitejs/plugin-react's optional
# @rolldown/plugin-babel peer resolve to a single @babel/core.
overrides:
  '@babel/core': ^7.29.0
  # browserslist reaches us only transitively (via @babel/core and vite's
  # update-browserslist-db). <=4.28.6 carries two high advisories —
  # GHSA-c83g-rgw3-j3cx (unbounded query cache -> OOM) and GHSA-73wf-gq98-2v4g
  # (prototype write via untrusted browserslist-stats.json). Pinned forward so
  # `pnpm audit --audit-level high` in CI passes.
  browserslist: ^4.28.8
  # The three below are the same situation as browserslist: transitive-only, and
  # carrying high advisories published after this branch last went green on
  # 2026-08-28. `pnpm audit` queries the live advisory database, so these began
  # failing CI on their publication dates with no change to our code. Each fix
  # is a patch bump inside the same minor.
  #
  # fast-uri <3.1.6 — GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc,
  # GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp (SSRF and host confusion).
  fast-uri: ^3.1.6
  # js-yaml <4.3.2 — GHSA-2883-xcg3-v3hh (maxTotalMergeKeys does not bound CPU
  # on empty merge keys).
  js-yaml: ^4.3.2
  # svgo <3.3.5 — GHSA-w27v-7q3p-w38r (removeScripts lets executable links
  # through via namespaced attributes).
  svgo: ^3.3.5

# Dependency install scripts are blocked by default in pnpm 11 and `strictDepBuilds`
# now defaults to true, so an unlisted package that wants to build fails the install
# with ERR_PNPM_IGNORED_BUILDS rather than warning. Add packages here as that error
# names them — do not disable the check.
#
# chromedriver is load-bearing for `test:a11y`: its install script downloads the
# driver binary. Blocking it makes the accessibility audit fail at run time.
allowBuilds:
  esbuild: true
  fsevents: true
  '@vercel/speed-insights': true
  chromedriver: true

# Enforce package.json's `engines.node` floor instead of warning past it. The floor
# is >=22.13.0: vite/rolldown/@vitejs/plugin-react need >=22.12.0, and pnpm 11.21+
# needs >=22.13. Without this, `engines` is documentation that nothing checks.
# .nvmrc and CI (`node-version-file`) share one pin so a 22.x below the floor
# cannot reach `pnpm install`.
engineStrict: true
# Note on minimumReleaseAge: pnpm 11 defaults it to 1440 minutes (24h), which blocks
# freshly published versions and is a real defense against the npm worm campaigns.
# It is deliberately NOT set explicitly here: setting it flips
# `minimumReleaseAgeStrict` to true, which makes resolution *fail* instead of
# falling back when nothing in range is old enough. The default gives the
# protection without the brittleness.

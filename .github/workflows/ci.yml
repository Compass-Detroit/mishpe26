name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# pnpm/action-setup must run BEFORE actions/setup-node: setup-node's `cache: 'pnpm'`
# needs the pnpm binary on PATH to resolve the store path. No `version:` input is
# given — action-setup reads the `packageManager` field from package.json, so the
# pinned version lives in exactly one place. Node comes from `.nvmrc` via
# `node-version-file` so CI cannot pick a 22.x below engines.node (>=22.13.0).
#
# Note on `pnpm install --frozen-lockfile`: pnpm 11 sets `minimumReleaseAge` to 1440
# minutes by default and `trustLockfile` to false, so CI re-verifies every locked
# entry against that age on each install. A dependency bumped to a version published
# less than 24h ago will fail here even though the lockfile is frozen. That is the
# supply-chain guard doing its job — wait it out rather than setting trustLockfile.

jobs:
  quality-and-build:
    name: Code Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Check Prettier formatting
        run: pnpm run format:check

      - name: Build application
        run: |
          timeout 300 pnpm run build || {
            echo "Build failed or timed out after 5 minutes"
            exit 1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-files
          path: dist/
          retention-days: 1

  accessibility-check:
    name: Accessibility Check
    runs-on: ubuntu-latest
    needs: quality-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-files
          path: dist/

      - name: Install ChromeDriver matching installed Chrome
        uses: nanasess/setup-chromedriver@v2

      # Runs the same script as `pnpm run test:a11y`, so CI and local audit an
      # identical route list. The script starts and stops its own server, so
      # there is no separate serve step to keep in sync. It is invoked directly
      # rather than through the npm script because that would rebuild, throwing
      # away the artifact downloaded above.
      #
      # CI has no browser-driver-manager install, so point axe at the system
      # chromedriver installed by setup-chromedriver.
      - name: Run accessibility tests
        run: AXE_CHROMEDRIVER_PATH="$(which chromedriver)" node scripts/a11y-test.mjs

  security-check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Moderate vulnerabilities in dev dependencies are acceptable for a static
      # site; high and critical fail the build. The previous form ended in
      # `exit 0`, which swallowed every severity including the ones it claimed
      # to catch, so this step could never fail.
      - name: Run security audit
        run: pnpm audit --audit-level high
